protocols = imap
listen = *
ssl = no
disable_plaintext_auth = no
auth_mechanisms = plain login
mail_location = maildir:/home/vmail/Maildir
mail_fsync = never
maildir_copy_with_hardlinks = yes
mail_attribute_dict = file:%h/dovecot-attributes
imap_metadata = yes
log_path = /dev/stderr
info_log_path = /dev/stderr
default_internal_user = vmail

service imap-login {
  inet_listener imap {
    port = 143
  }
  inet_listener imaps {
    port = 0
  }
}

passdb {
  driver = passwd-file
  args = /etc/dovecot/users
}

userdb {
  driver = passwd-file
  args = /etc/dovecot/users
}

namespace inbox {
  inbox = yes
  separator = /

  mailbox Drafts {
    special_use = \Drafts
    auto = create
  }

  mailbox Sent {
    special_use = \Sent
    auto = create
  }

  mailbox Trash {
    special_use = \Trash
    auto = create
  }

  mailbox Junk {
    special_use = \Junk
    auto = create
  }
}

protocol imap {
  mail_max_userip_connections = 50
}
