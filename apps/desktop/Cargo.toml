[package]
name = "siskin-desktop"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Slint desktop shell (Windows/Linux) for Siskin"

[dependencies]
slint = { workspace = true, features = ["raw-window-handle-06"] }

[target.'cfg(windows)'.dependencies]
wry = { version = "0.57", default-features = false }

[build-dependencies]
slint-build.workspace = true

[lints]
workspace = true
