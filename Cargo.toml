[workspace]
resolver = "2"
members = [
  "crates/mail-crypto",
  "crates/mail-store",
  "crates/mail-proto",
  "crates/mail-parse",
  "crates/mail-sync",
  "crates/mail-core",
  "crates/mail-cli",
  "crates/mail-ffi",
  "crates/mail-api",
  "crates/mail-hub",
  "spike/imap-probe",
  "spike/rrule-probe",
  "spike/html-probe",
  "spike/ffi-probe",
  "spike/windows-ui",
]

[workspace.metadata]
name = "eyrie"

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false

[workspace.dependencies]
ammonia = "4"
anyhow = "1"
axum = "0.8"
base64 = "0.22"
chacha20poly1305 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
encoding_rs = "0.8"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
rand = "0.8"
hkdf = "0.12"
quoted_printable = "0.5"
rusqlite = { version = "0.32", features = ["bundled-sqlcipher-vendored-openssl", "chrono", "functions"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "io-util", "sync"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
zeroize = { version = "1", features = ["derive"] }

# UI spike only; apps/desktop will use the same features. The software renderer
# avoids the OpenGL driver's private allocations on Windows (docs/SPIKE-REPORT.md §10).
slint = { version = "1.18.1", default-features = false, features = [
  "std",
  "backend-winit",
  "renderer-software",
  "software-renderer-systemfonts",
  "accessibility",
  "compat-1-18",
] }
slint-build = "1.18.1"

[profile.release]
lto = "thin"
codegen-units = 1

[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
